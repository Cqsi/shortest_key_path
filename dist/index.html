<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An interactive shortest path visualizer for keys and locks." />
    <title>Shortest Key Path</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='white'/%3E%3Cpath d='M7 25l9-9m0 0a5 5 0 1 0 2-2l-2 2zm-6 2h10v-3H8v-3h3v-3' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app" aria-label="Shortest key path editor">
      <div class="grid-viewport" id="gridViewport">
        <div class="grid-stage" id="gridStage">
          <div class="grid" id="grid" role="grid" aria-label="Editable key maze"></div>
          <svg class="path-overlay" id="pathOverlay" aria-hidden="true">
            <path class="path-halo" id="pathHalo" d="" vector-effect="non-scaling-stroke"></path>
            <path class="path-line" id="pathLine" d="" vector-effect="non-scaling-stroke"></path>
          </svg>
        </div>
      </div>

      <div class="toolbar" aria-label="Grid controls">
        <button class="tool direct-tool active" data-tool="pan" type="button" aria-pressed="true" aria-label="Move grid">
          <svg class="pointer-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5 18.2 12l-6.1 1.25L9 19.1 5 3.5Z"></path></svg>
        </button>
        <button class="tool direct-tool" data-tool="erase" type="button" aria-pressed="false" aria-label="Erase">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4.2 14.3 8.9-8.9a2 2 0 0 1 2.8 0l2.7 2.7a2 2 0 0 1 0 2.8l-8.9 8.9H5.8l-1.6-1.6a2.8 2.8 0 0 1 0-3.9Z"></path><path d="m10.2 8.3 5.5 5.5M9.7 19.8H20"></path></svg>
        </button>

        <span class="divider" aria-hidden="true"></span>

        <div class="popover-anchor">
          <button class="icon-button add-button" id="addButton" type="button" aria-label="Add to grid" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
          <div class="popover add-popover" id="addPopover" role="menu" aria-label="Add to grid" hidden>
            <button class="menu-tool tool" data-tool="wall" type="button" role="menuitem" aria-label="Wall"><span id="wallToolGlyph"></span></button>
            <button class="menu-tool tool" data-tool="start" type="button" role="menuitem" aria-label="Start point"><span id="startToolGlyph"></span></button>
            <button class="menu-tool tool" id="keyMenuButton" data-tool="key" type="button" role="menuitem" aria-label="Next key"><span id="keyToolGlyph"></span></button>
            <button class="menu-tool tool" id="lockMenuButton" data-tool="lock" type="button" role="menuitem" aria-label="Matching lock" aria-expanded="false"><span id="lockToolGlyph"></span></button>
            <div class="lock-picker" id="lockPicker" role="menu" aria-label="Choose a matching lock" hidden>
              <div id="lockChoices"></div>
            </div>
          </div>
        </div>

        <span class="divider" aria-hidden="true"></span>

        <div class="popover-anchor">
          <button class="icon-button" id="settingsButton" type="button" aria-label="Grid settings" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h5M15 7h5M4 12h9M19 12h1M4 17h2M12 17h8"></path><circle cx="12" cy="7" r="2"></circle><circle cx="16" cy="12" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>
          </button>
          <div class="popover settings-popover" id="settingsPopover" role="dialog" aria-label="Grid size" hidden>
            <label><span>Rows</span><input id="rowInput" type="number" min="3" max="30" value="8" /></label>
            <label><span>Columns</span><input id="colInput" type="number" min="3" max="30" value="12" /></label>
          </div>
        </div>

        <button class="run" id="runButton" type="button" aria-label="Run breadth-first search"><span id="runIcon">▶</span></button>
      </div>
      <span class="sr-only" id="statusMessage">Ready</span>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
