<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An interactive shortest path visualizer for keys and locks." />
    <title>Shortest Key Path</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='white'/%3E%3Cpath d='M7 25l9-9m0 0a5 5 0 1 0 2-2l-2 2zm-6 2h10v-3H8v-3h3v-3' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app" aria-label="Shortest key path editor">
      <div class="toolbar" aria-label="Grid controls">
        <div class="control-group dimensions">
          <input id="rowInput" type="number" min="3" max="30" value="8" aria-label="Rows" />
          <span aria-hidden="true">×</span>
          <input id="colInput" type="number" min="3" max="30" value="12" aria-label="Columns" />
          <button id="applySize" type="button" aria-label="Apply grid size" data-tip="Apply">↵</button>
        </div>

        <div class="control-group tools" role="radiogroup" aria-label="Tile type">
          <button class="tool active" data-tool="wall" type="button" role="radio" aria-checked="true" aria-label="Wall" data-tip="Wall">■</button>
          <button class="tool" data-tool="erase" type="button" role="radio" aria-checked="false" aria-label="Erase" data-tip="Erase">□</button>
          <button class="tool" data-tool="start" type="button" role="radio" aria-checked="false" aria-label="Start" data-tip="Start">●</button>
          <button class="tool letter-tool" data-tool="key" type="button" role="radio" aria-checked="false" aria-label="Key" data-tip="Key"><span id="keyToolGlyph">a</span></button>
          <button class="tool letter-tool lock-tool" data-tool="lock" type="button" role="radio" aria-checked="false" aria-label="Lock" data-tip="Lock"><span id="lockToolGlyph">A</span></button>
          <select id="letterSelect" aria-label="Key or lock letter"></select>
        </div>

        <div class="control-group actions">
          <button id="sampleButton" type="button" aria-label="Load sample" data-tip="Sample">↺</button>
          <button id="clearButton" type="button" aria-label="Clear grid" data-tip="Clear">×</button>
          <button class="run" id="runButton" type="button" aria-label="Run breadth-first search" data-tip="Run"><span id="runIcon">▶</span></button>
        </div>
      </div>

      <div class="grid-viewport" id="gridViewport">
        <div class="grid-stage" id="gridStage">
          <div class="grid" id="grid" role="grid" aria-label="Editable key maze"></div>
          <svg class="path-overlay" id="pathOverlay" aria-hidden="true">
            <polyline id="pathLine" points=""></polyline>
          </svg>
        </div>
        <output class="zoom-readout" id="zoomValue" aria-live="polite">100%</output>
      </div>

      <div class="result" aria-live="polite">
        <output id="stepMetric">—</output>
        <div id="keyOrder" aria-label="Collected key order"></div>
      </div>
      <span class="sr-only" id="statusMessage">Ready</span>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
